{% extends "base.html" %}
{% block title %}Edit Entry — Project Register{% endblock %}

{% block content %}

<section class="form-page">
    <div class="form-card">
        <div class="card-tear"></div>
        <p class="form-eyebrow">Editing Entry #{{ project.id }}</p>
        <h2 class="form-heading">{{ project.project_title }}</h2>

        <form method="POST" action="{{ url_for('edit_project', project_id=project.id) }}">
            <div class="field-row">
                <label for="client_name">Client name</label>
                <input type="text" id="client_name" name="client_name" value="{{ project.client_name }}" required>
            </div>

            <div class="field-row">
                <label for="project_title">Project title</label>
                <input type="text" id="project_title" name="project_title" value="{{ project.project_title }}" required>
            </div>

            <div class="field-grid">
                <div class="field-row">
                    <label for="dataset_type">Dataset type</label>
                    <input type="text" id="dataset_type" name="dataset_type" value="{{ project.dataset_type or '' }}">
                </div>
                <div class="field-row">
                    <label for="status">Status</label>
                    <select id="status" name="status">
                        <option value="pending" {% if project.status == 'pending' %}selected{% endif %}>Pending</option>
                        <option value="in-progress" {% if project.status == 'in-progress' %}selected{% endif %}>In Progress</option>
                        <option value="completed" {% if project.status == 'completed' %}selected{% endif %}>Completed</option>
                    </select>
                </div>
            </div>

            <div class="field-row">
                <label for="deadline">Deadline</label>
                <input type="date" id="deadline" name="deadline" value="{{ project.deadline.isoformat() if project.deadline else '' }}">
            </div>

            <div class="field-row">
                <label for="notes">Notes</label>
                <textarea id="notes" name="notes" rows="4">{{ project.notes or '' }}</textarea>
            </div>

            <div class="form-actions">
                <a href="{{ url_for('index') }}" class="btn btn-text">Cancel</a>
                <button type="submit" class="btn btn-primary">Update entry</button>
            </div>
        </form>
    </div>
</section>

{% endblock %}
