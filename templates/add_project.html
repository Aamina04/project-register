{% extends "base.html" %}
{% block title %}New Entry — Project Register{% endblock %}

{% block content %}

<section class="form-page">
    <div class="form-card">
        <div class="card-tear"></div>
        <p class="form-eyebrow">New Register Entry</p>
        <h2 class="form-heading">Add a project</h2>

        <form method="POST" action="{{ url_for('add_project') }}">
            <div class="field-row">
                <label for="client_name">Client name</label>
                <input type="text" id="client_name" name="client_name" placeholder="e.g. Dr. Ayesha Malik" required>
            </div>

            <div class="field-row">
                <label for="project_title">Project title</label>
                <input type="text" id="project_title" name="project_title" placeholder="e.g. Household Survey — Nutrition Study" required>
            </div>

            <div class="field-grid">
                <div class="field-row">
                    <label for="dataset_type">Dataset type</label>
                    <input type="text" id="dataset_type" name="dataset_type" placeholder="e.g. Survey Data (CSV)">
                </div>
                <div class="field-row">
                    <label for="status">Status</label>
                    <select id="status" name="status">
                        <option value="pending">Pending</option>
                        <option value="in-progress">In Progress</option>
                        <option value="completed">Completed</option>
                    </select>
                </div>
            </div>

            <div class="field-row">
                <label for="deadline">Deadline</label>
                <input type="date" id="deadline" name="deadline" min="{{ today }}">
            </div>

            <div class="field-row">
                <label for="notes">Notes</label>
                <textarea id="notes" name="notes" rows="4" placeholder="Progress notes, blockers, next steps…"></textarea>
            </div>

            <div class="form-actions">
                <a href="{{ url_for('index') }}" class="btn btn-text">Cancel</a>
                <button type="submit" class="btn btn-primary">Save entry</button>
            </div>
        </form>
    </div>
</section>

{% endblock %}
